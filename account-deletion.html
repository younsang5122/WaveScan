<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원 탈퇴 — WaveScan</title>
  <meta name="description" content="WaveScan 회원 탈퇴 — 계정 및 데이터 삭제 절차를 안내합니다.">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/account-deletion.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="header-inner">
      <a href="mypage.html" class="header-btn" aria-label="뒤로">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <span class="header-title" style="position:absolute;left:50%;transform:translateX(-50%);">회원 탈퇴</span>
      <div style="width:38px;"></div>
    </div>
  </header>

  <!-- Main -->
  <main class="main-content no-bottom">

    <!-- Hero -->
    <div class="deletion-hero">
      <div class="deletion-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
      <h1 class="deletion-title">정말 탈퇴하시겠어요?</h1>
      <p class="deletion-sub">탈퇴 후에는 계정과 모든 스캔 데이터가 영구 삭제되며 복구할 수 없습니다.</p>
    </div>

    <!-- Warning -->
    <div class="deletion-warning">
      <div class="deletion-warning-title">
        <i class="fa-solid fa-circle-exclamation"></i> 탈퇴 전 꼭 확인하세요
      </div>
      <div class="deletion-warning-list">
        <div class="deletion-warning-item">
          <i class="fa-solid fa-xmark"></i>
          모든 스캔 기록 및 분석 결과가 삭제됩니다
        </div>
        <div class="deletion-warning-item">
          <i class="fa-solid fa-xmark"></i>
          프로필 정보 및 개인 통계가 삭제됩니다
        </div>
        <div class="deletion-warning-item">
          <i class="fa-solid fa-xmark"></i>
          동일 이메일로 재가입하더라도 데이터를 복구할 수 없습니다
        </div>
        <div class="deletion-warning-item">
          <i class="fa-solid fa-xmark"></i>
          탈퇴 처리 후 즉시 반영됩니다
        </div>
      </div>
    </div>

    <!-- Reason -->
    <div class="deletion-form">
      <div class="input-group" style="margin-bottom:0;">
        <label class="input-label">탈퇴 사유 (선택)</label>
        <div style="display:flex; flex-direction:column; gap:8px; margin-top:8px;">
          <div class="reason-option" data-reason="not-useful">
            <div class="reason-radio"></div>
            <div class="reason-text">서비스가 필요하지 않아요</div>
          </div>
          <div class="reason-option" data-reason="inaccurate">
            <div class="reason-radio"></div>
            <div class="reason-text">분석 결과가 정확하지 않아요</div>
          </div>
          <div class="reason-option" data-reason="privacy">
            <div class="reason-radio"></div>
            <div class="reason-text">개인정보 보호가 걱정돼요</div>
          </div>
          <div class="reason-option" data-reason="switch-account">
            <div class="reason-radio"></div>
            <div class="reason-text">다른 계정으로 재가입하려 해요</div>
          </div>
          <div class="reason-option" data-reason="other">
            <div class="reason-radio"></div>
            <div class="reason-text">기타</div>
          </div>
        </div>
      </div>

      <!-- Confirm check -->
      <div class="confirm-check-wrap" id="confirmWrap">
        <div class="confirm-checkbox" id="confirmCheckbox"></div>
        <div class="confirm-check-text">
          위 내용을 모두 확인했으며, 회원 탈퇴 시 모든 데이터가 삭제됨에 동의합니다.
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="deletion-actions">
      <button class="btn btn-danger" id="deleteAccountBtn" disabled>
        <i class="fa-solid fa-trash"></i> 회원 탈퇴 진행
      </button>
      <a href="mypage.html" class="btn btn-ghost">탈퇴 취소</a>
    </div>

  </main>

  <div class="toast" id="toast"></div>
  <script src="js/auth.js"></script>
  <script src="js/account-deletion.js"></script>
</body>
</html>
