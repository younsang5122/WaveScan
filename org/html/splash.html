<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WaveScan — AI 전자레인지 용기 안전 검사</title>
  <meta name="description" content="WaveScan으로 주방 용기의 전자레인지 안전성을 AI가 즉시 분석해드립니다.">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/splash.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="splash-page">
    <!-- Decorative blobs -->
    <div class="splash-blob b1"></div>
    <div class="splash-blob b2"></div>
    <div class="splash-blob b3"></div>

    <!-- Wave rings -->
    <div class="splash-rings">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
    </div>

    <!-- Content -->
    <div class="splash-content">
      <div class="splash-logo-wrap">
        <img src="img/logo.jpg" alt="WaveScan 로고" class="splash-logo">
      </div>
      <div class="splash-brand">Wave Scan</div>
      <div class="splash-tagline">AI 기반 전자레인지 용기 안전 검사</div>

      <div class="splash-loader">
        <div class="loader-bar">
          <div class="loader-fill" id="loaderFill"></div>
        </div>
        <div class="loader-text" id="loaderText">서비스를 준비하는 중...</div>
      </div>
    </div>

    <div class="splash-footer">안전한 주방 생활의 시작 · WaveScan</div>
  </div>

  <script src="js/splash.js"></script>
</body>
</html>
