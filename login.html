<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 — WaveScan</title>
  <meta name="description" content="WaveScan에 로그인하여 AI 용기 안전 분석 서비스를 이용해보세요.">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/auth-start.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="auth-page">
    <!-- Decorative circles -->
    <div class="auth-deco d1"></div>
    <div class="auth-deco d2"></div>
    <div class="auth-deco d3"></div>

    <!-- Hero -->
    <div class="auth-hero">
      <div class="auth-logo-ring anim-fade-in-up">
        <img src="img/logo.jpg" alt="WaveScan 로고" class="auth-logo">
      </div>
      <div class="auth-brand anim-fade-in-up anim-delay-1">WaveScan</div>
      <div class="auth-headline anim-fade-in-up anim-delay-2">
        안전한 주방 생활의 시작
      </div>
      <p class="auth-desc anim-fade-in-up anim-delay-3">
        AI 스캔으로 주방 용기의 전자레인지<br>안전성을 즉시 확인하세요
      </p>

      <div class="auth-features anim-fade-in-up anim-delay-4">
        <span class="auth-chip"><i class="fa-solid fa-bolt"></i> 즉시 분석</span>
        <span class="auth-chip"><i class="fa-solid fa-shield-halved"></i> 안전 등급</span>
        <span class="auth-chip"><i class="fa-solid fa-clock-rotate-left"></i> 기록 관리</span>
      </div>
    </div>

    <!-- Login card (Google + Guest Only) -->
    <div class="auth-card-wrap">
      <div class="auth-card">
        <div class="auth-card-title">로그인</div>
        <p class="auth-card-sub">원하는 방식으로 서비스를 시작해보세요</p>

        <!-- Google Login -->
        <button class="btn-google-auth" id="googleLoginBtn" onclick="handleGoogleLogin()">
          <!-- Google SVG logo -->
          <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Google로 계속하기
        </button>

        <div class="auth-divider">
          <span>또는</span>
        </div>

        <!-- Guest Login -->
        <button class="btn-guest" id="guestBtn" onclick="handleGuestLogin()">
          <i class="fa-regular fa-user"></i>
          로그인 없이 사용하기
        </button>

        <p class="auth-notice">
          로그인하면 WaveScan의 <a href="#">이용약관</a> 및 <a href="#">개인정보처리방침</a>에 동의하게 됩니다.
          비로그인 상태에서도 스캔 기능을 이용할 수 있으나 기록 저장은 제한됩니다.
        </p>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
